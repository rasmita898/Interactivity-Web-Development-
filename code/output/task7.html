<!DOCTYPE html>
<html>
<head>
    <title>Study Hub</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
    <h1 class="text-center text-primary">Study Hub</h1>
    <div class="card mt-4">
        <div class="card-body">
            <h3 class="card-title">Welcome</h3>
            <p class="card-text">
                Study Hub is an online learning platform that helps students
                improve their programming and web development skills through
                interactive lessons and practical projects.
            </p>
            <img src="c:\Users\goudo\OneDrive\Documents\study.jpg"alt="Sample Image" alt="Sample Image" class="img-fluid rounded mb-3" alt="Study Hub">
            <button class="btn btn-success" onclick="changeColor()">
                Change Background
            </button>
        </div>
    </div>
    </div>
    <h2>Student Registration Form</h2>
    <form onsubmit="return validateForm()">
    <label>Name:</label><br>
    <input type="text" id="name"><br><br>
    <label>Email:</label><br>
    <input type="email" id="email"><br><br>
    <label>Password:</label><br>
    <input type="password" id="password"><br><br>
    <input type="submit" value="Register">
    </form>
    <p id="message"></p>
    <script src="script.js"></script>
</body>
</html>
